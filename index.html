<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>박용건</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
    line-height: 1.6;
  }
  h1 {
    font-size: 2.2em;
    margin-bottom: 10px;
  }
  p {
    font-size: 1.05em;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: left;
  }
  th {
    background-color: #f5f5f5;
  }
</style>
</head>
<body>
  <h1>박용건</h1>
  <p>
    안녕하세요, 6년차 CX 매니저 박용건입니다@@@@.<br>
    영화 보는 것을 좋아하는 청년이고, 뉴욕이라는 도시를 특히 좋아합니다.<br>
    새로운 경험과 이야기를 즐기며 살아가고 있습니다.
  </p>

  <table>
    <thead>
      <tr>
        <th>항목</th>
        <th>설명</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>여행</td>
        <td>새로운 도시를 탐험하는 것을 좋아하며, 특히 뉴욕을 가장 좋아합니다.</td>
      </tr>
      <tr>
        <td>영화</td>
        <td>다양한 장르의 영화를 즐겨 보며, 여가 시간을 영화관에서 보내는 것을 좋아합니다.</td>
      </tr>
      <tr>
        <td>동물</td>
        <td>동물을 좋아하고 관심이 많습니다.</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
